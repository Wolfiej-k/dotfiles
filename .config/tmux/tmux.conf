# ==========================================
# ===          General Settings          ===
# ==========================================

# Terminal colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Pane and window indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Timing and behavior
set -sg escape-time 0
set -g repeat-time 200
set -g mouse on
set -g bell-action none

# Window activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# ==========================================
# ===            Key Bindings            ===
# ==========================================

# Prefix key
unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

# Window management
bind-key w new-window -c "#{pane_current_path}"
bind-key -r p previous-window
bind-key -r n next-window
bind-key -r o last-window
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9

# Pane management
bind-key s split-window -h -c "#{pane_current_path}"
bind-key x split-window -v -c "#{pane_current_path}"
bind-key @ choose-window "join-pane -h -s '%%'"
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# Session management
bind-key t choose-tree

bind-key g switch-client -T resize
bind-key -T resize h resize-pane -L 5 \; switch-client -T resize
bind-key -T resize j resize-pane -D 3 \; switch-client -T resize
bind-key -T resize k resize-pane -U 3 \; switch-client -T resize
bind-key -T resize l resize-pane -R 5 \; switch-client -T resize
bind-key -T resize Escape switch-client -T root

# Smart pane/window killing
bind-key q if-shell '[ "$(tmux display-message -p "#{window_panes}")" -gt 1 ]' \
  'kill-pane' \
  'kill-window'

# Vim copy mode
set-option -g mode-keys vi
bind-key c copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key v paste-buffer

# Git popups
bind-key u switch-client -T git
bind-key -T git l display-popup -E -d "#{pane_current_path}" \
  "bash -i -c 'git log'"
bind-key -T git b display-popup -E -d "#{pane_current_path}" \
  "bash -i -c \"git branch --format='%(refname:short)' | fzf | xargs git checkout\""

# ==========================================
# ===         Plugin Management          ===
# ==========================================

# Set plugin installation path
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins"

# Auto-install TPM
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm \
        ~/.config/tmux/plugins/tpm && \
        ~/.config/tmux/plugins/tpm/bin/install_plugins'"
set -g @plugin "tmux-plugins/tpm"

# Save and restore sessions
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @continuum-restore "on"
set -g @resurrect-capture-pane-contents "on"

# Tokyo night theme
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @tokyo-night-tmux_window_id_style none
set -g @tokyo-night-tmux_pane_id_style dsquare
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_date_format MYD
set -g @tokyo-night-tmux_time_format 12H
set -g @tokyo-night-tmux_transparent 0
set -g @tokyo-night-tmux_show_git 1

# Initialize TPM
run "~/.config/tmux/plugins/tpm/tpm"
