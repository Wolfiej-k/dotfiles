# Prefix key
unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

# Terminal colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

bg="#1A1B26"
bg_dark="#16161E"
bg_highlight="#292E42"
terminal_black="#414868"
fg="#C0CAF5"
fg_dark="#A9B1D6"
fg_gutter="#3B4261"
dark3="#545C7E"
comment="#565F89"
dark5="#737AA2"
blue0="#3D59A1"
blue="#7AA2F7"
cyan="#7DCFFF"
blue1="#2AC3DE"
blue2="#0DB9D7"
blue5="#89DDFF"
blue6="#B4F9F8"
blue7="#394B70"
magenta="#BB9AF7"
magenta2="#FF007C"
purple="#9D7CD8"
orange="#FF9E64"
yellow="#E0AF68"
green="#9ECE6A"
green1="#73DACA"
green2="#41A6B5"
teal="#1ABC9C"
red="#F7768E"
red1="#DB4B4B"
git_change="#6183BB"
git_add="#449DAB"
git_delete="#914C54"

# Status bar
set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -g status-left-length 90
set -g status-right-length 90
set -g status-style "bg=$bg,fg=$fg"
set -g status-left "#[fg=$bg_dark,bg=$green,bold] #S #[fg=$green,bg=$bg]"
set -g status-right "#[fg=$fg_dark,bg=$bg] #(whoami)@#H #[fg=$purple,bg=$bg]#[fg=$bg_dark,bg=$purple,bold] %H:%M #[fg=$blue,bg=$purple]#[fg=$bg_dark,bg=$blue,bold] %Y-%m-%d "

# Window management
bind-key w new-window -c "#{pane_current_path}"
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9

set -g base-index 1
set -g renumber-windows on
setw -g window-status-format "#[fg=$comment,bg=$bg] #I:#W "
setw -g window-status-current-format "#[fg=$bg,bg=$blue,bold] #I:#W "
setw -g window-status-separator ""

# Pane management
bind-key s split-window -h -c "#{pane_current_path}"
bind-key v split-window -v -c "#{pane_current_path}"
bind-key @ choose-window "join-pane -h -s '%%'"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key y switch-client -T resize
bind-key -T resize h resize-pane -L 5 \; switch-client -T resize
bind-key -T resize j resize-pane -D 3 \; switch-client -T resize
bind-key -T resize k resize-pane -U 3 \; switch-client -T resize
bind-key -T resize l resize-pane -R 5 \; switch-client -T resize
bind-key -T resize Escape switch-client -T root

bind-key q if-shell '[ "$(tmux display-message -p "#{window_panes}")" -gt 1 ]' \
  'kill-pane' \
  'kill-window'

setw -g pane-base-index 1
set -g pane-border-style "fg=$bg_highlight"
set -g pane-active-border-style "fg=$blue"
set -g display-panes-active-colour "$blue"
set -g display-panes-colour "$comment"

# Copy mode
bind-key c copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key p paste-buffer

set-option -g mode-keys vi
setw -g mode-style "bg=$blue,fg=$bg_dark"

# Message pop-ups
set -g message-style "bg=$bg_highlight,fg=$fg"
set -g message-command-style "bg=$bg_highlight,fg=$fg"

# Clock mode
setw -g clock-mode-colour "$blue"

# Window activity
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "fg=$red,bg=$bg"

# Shell sound
set -g bell-action none

# Escape time
set -sg escape-time 0

# Mouse support
set -g mouse on

# Reload config
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded!"
