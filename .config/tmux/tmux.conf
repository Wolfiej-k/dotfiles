# Prefix key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

bg="#1A1B26"
bg_dark="#16161E"
bg_highlight="#292E42"
terminal_black="#414868"
fg="#C0CAF5"
fg_dark="#A9B1D6"
fg_gutter="#3B4261"
dark3="#545C7E"
comment="#565F89"
dark5="#737AA2"
blue0="#3D59A1"
blue="#7AA2F7"
cyan="#7DCFFF"
blue1="#2AC3DE"
blue2="#0DB9D7"
blue5="#89DDFF"
blue6="#B4F9F8"
blue7="#394B70"
magenta="#BB9AF7"
magenta2="#FF007C"
purple="#9D7CD8"
orange="#FF9E64"
yellow="#E0AF68"
green="#9ECE6A"
green1="#73DACA"
green2="#41A6B5"
teal="#1ABC9C"
red="#F7768E"
red1="#DB4B4B"
git_change="#6183BB"
git_add="#449DAB"
git_delete="#914C54"

# Status bar
set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -g status-left-length 90
set -g status-right-length 90
set -g status-style "bg=$bg,fg=$fg"
set -g status-left "#[fg=$bg_dark,bg=$green,bold] #S #[fg=$green,bg=$bg]"
set -g status-right "#[fg=$fg_dark,bg=$bg] #(whoami)@#H #[fg=$purple,bg=$bg]#[fg=$bg_dark,bg=$purple,bold] %H:%M #[fg=$blue,bg=$purple]#[fg=$bg_dark,bg=$blue,bold] %Y-%m-%d "

# Window management
bind-key -n M-w new-window -c "#{pane_current_path}"
bind-key -n M-H previous-window
bind-key -n M-L next-window
bind-key -n M-J swap-window -t -1
bind-key -n M-K swap-window -t +1

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

set -g base-index 1
set -g renumber-windows on
setw -g window-status-format "#[fg=$comment,bg=$bg] #I:#W "
setw -g window-status-current-format "#[fg=$bg,bg=$blue,bold] #I:#W "
setw -g window-status-separator ""

# Pane management
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key s split-window -h -c "#{pane_current_path}"
bind-key S split-window -v -c "#{pane_current_path}"
bind-key @ choose-window "join-pane -h -s '%%'"

bind-key -n M-h if-shell "$is_vim" "send-keys M-h" "select-pane -L"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j" "select-pane -D"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k" "select-pane -U"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l" "select-pane -R"

bind-key -n M-o if-shell "$is_vim" "send-keys M-o" "resize-pane -L 5"
bind-key -n M-p if-shell "$is_vim" "send-keys M-p" "resize-pane -R 5"
bind-key -n M-O if-shell "$is_vim" "send-keys M-O" "resize-pane -U 3"
bind-key -n M-P if-shell "$is_vim" "send-keys M-P" "resize-pane -D 3"

bind-key -T copy-mode-vi M-h select-pane -L
bind-key -T copy-mode-vi M-j select-pane -D
bind-key -T copy-mode-vi M-k select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R

bind-key q if-shell '[ "$(tmux display-message -p "#{window_panes}")" -gt 1 ]' \
  'kill-pane' \
  'kill-window'

setw -g pane-base-index 1
set -g pane-border-style "fg=$bg_highlight"
set -g pane-active-border-style "fg=$blue"
set -g display-panes-active-colour "$blue"
set -g display-panes-colour "$comment"

# Copy mode
bind-key c copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind p paste-buffer

set-option -g mode-keys vi
setw -g mode-style "bg=$blue,fg=$bg_dark"

# Message pop-ups
set -g message-style "bg=$bg_highlight,fg=$fg"
set -g message-command-style "bg=$bg_highlight,fg=$fg"

# Clock mode
setw -g clock-mode-colour "$blue"

# Window activity
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "fg=$red,bg=$bg"

# Shell sound
set -g bell-action none

# Escape time
set -sg escape-time 0

# Mouse support
set -g mouse on

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded!"
